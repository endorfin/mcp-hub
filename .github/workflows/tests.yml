name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Unlocked keychain for the keychain and OAuth tests
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci mcp-hub-ci.keychain
          security default-keychain -s mcp-hub-ci.keychain
          security unlock-keychain -p ci mcp-hub-ci.keychain
          security set-keychain-settings -t 3600 mcp-hub-ci.keychain

      - name: Secret Service for the keychain and OAuth tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring libsecret-tools

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
        env:
          MCP_HUB_REQUIRE_KEYCHAIN: "1"

      - name: Run tests
        if: runner.os == 'Linux'
        env:
          MCP_HUB_REQUIRE_KEYCHAIN: "1"
        run: |
          dbus-run-session -- sh -c '
            mkdir -p ~/.local/share/keyrings && printf login > ~/.local/share/keyrings/default
            printf test | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            python -m unittest discover -s tests -v'

      - name: Autostart smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./autostart.ps1 install
          if (-not (Get-ScheduledTask -TaskName "MCP Hub" -ErrorAction SilentlyContinue)) { throw "task was not registered" }
          ./autostart.ps1 status
          ./autostart.ps1 uninstall
          if (Get-ScheduledTask -TaskName "MCP Hub" -ErrorAction SilentlyContinue) { throw "task was not removed" }
