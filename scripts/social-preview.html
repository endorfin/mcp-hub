<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MCP Hub social preview</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #141413; color: #ecebe6; font-family: -apple-system, system-ui, sans-serif; }
  .text { position: absolute; left: 72px; top: 182px; width: 470px; }
  .kicker { display: flex; align-items: center; gap: 10px; font-size: 20px; color: #9a998f; }
  .kicker i { width: 16px; height: 16px; border-radius: 50%; background: #4cc27f; box-shadow: 0 0 0 3px rgb(76 194 127 / .25); }
  h1 { margin: 22px 0 0; font-size: 76px; font-weight: 650; letter-spacing: -.035em; line-height: 1; }
  p { margin: 30px 0 0; font-size: 23px; line-height: 1.55; color: #c9c8c1; }
  .chips { display: flex; gap: 8px; margin-top: 30px; }
  .chips span { font: 18px ui-monospace, "SF Mono", Menlo, monospace; color: #4cc27f; background: #262624; border-radius: 10px; padding: 6px 13px; white-space: nowrap; }
  .shot { position: absolute; left: 600px; top: 64px; width: 1200px; border: 1px solid #2e2e2b; border-radius: 12px; overflow: hidden; }
  .shot img { display: block; width: 100%; margin: -14px 0 0 -92px; }
</style>
</head>
<body>
  <div class="text">
    <div class="kicker"><i></i>Open source · local · no dependencies</div>
    <h1>MCP Hub</h1>
    <p>All your MCP servers in one place, served behind a single endpoint.</p>
    <div class="chips"><span>Claude Code</span><span>Codex</span><span>Copilot</span><span>Cursor</span></div>
  </div>
  <div class="shot"><img src="../docs/screenshot-dark.png" alt=""></div>
</body>
</html>
